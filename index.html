<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lord B: Save the Rainforest</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:monospace}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{position:relative;box-shadow:0 0 40px rgba(60,220,80,.25);border-radius:6px;overflow:hidden}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#scan{position:absolute;inset:0;pointer-events:none;display:none;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 50%,rgba(0,0,0,.38) 50%,rgba(0,0,0,.38) 100%);}
#scan.on{display:block}
#scan.on::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
#touch{display:none;width:100%;max-width:520px;box-sizing:border-box;padding:6px 6px calc(10px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;gap:6px}
#touch.on{display:flex}
#touch button{font:bold 11px monospace;color:#fff;background:#222;border:2px solid #555;border-radius:10px;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#touch button.dn{background:#c22;border-color:#f66}
.pad{display:grid;grid-template-columns:repeat(3,min(50px,12vw));grid-template-rows:repeat(3,44px);gap:3px}
.pad .up{grid-column:2;grid-row:1}.pad .lt{grid-column:1;grid-row:2}.pad .rt{grid-column:3;grid-row:2}.pad .dw{grid-column:2;grid-row:3}
.mid{display:flex;flex-direction:column;gap:6px}
.mid button{width:min(50px,12vw);height:30px;font-size:10px!important}
.acts{display:grid;grid-template-columns:repeat(3,min(56px,14vw));grid-template-rows:repeat(2,56px);gap:4px}
.acts .jp{background:#1a6e1a;border-color:#4f4}
.acts .sq{background:#8a6d00;border-color:#fd0}
.acts .ts{background:#5a3a14;border-color:#c90}
.acts .ds{background:#7a1010;border-color:#f44}
.acts .rn{background:#103a7a;border-color:#48f}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="c" width="224" height="256"></canvas><div id="scan"></div></div>
  <div id="touch">
    <div class="pad">
      <button class="up" data-a="up">&#9650;</button>
      <button class="lt" data-a="left">&#9664;</button>
      <button class="rt" data-a="right">&#9654;</button>
      <button class="dw" data-a="down">&#9660;</button>
    </div>
    <div class="mid">
      <button data-a="start">START</button>
      <button data-a="pause">PAUSE</button>
      <button data-a="mute">MUTE</button>
    </div>
    <div class="acts">
      <button class="sq" data-a="squawk">SQUAWK</button>
      <button class="ts" data-a="toss">SEED</button>
      <button class="ds" data-a="dash">DASH</button>
      <button class="rn" data-a="sprint">RUN</button>
      <button class="jp" data-a="jump" style="grid-column:2/4">JUMP/FLY</button>
    </div>
  </div>
</div>

 ctx.fillStyle='#8a5020';for(const sg of[-1,1])ctx.fillRect(Math.round(cx+dx*sg),Math.round(cy+dy*sg),1,1);}
function drawTape(t){// oil slick that spreads and recedes
 const y=Math.round(segY(t.seg,(t.x1+t.x2)/2)),mid=(t.x1+t.x2)/2,half=(t.x2-t.x1)/2,act=tapeActive(t),warn=tapeWarn(t);
 const w=act?half:warn?half*(0.35+0.15*((gt>>2)&1)):(t.cut>0?0:1.5);if(w<=0)return;
 const x0=Math.round(mid-w),x1=Math.round(mid+w);ctx.fillStyle='#08080c';ctx.fillRect(x0,y-2,x1-x0,2);ctx.fillRect(x0+2,y-3,Math.max(0,x1-x0-4),1);
 if(act){for(let x=x0+1;x<x1-1;x+=2){ctx.fillStyle=['#b040ff','#30d0ff','#40ff80','#ffd800'][(((x+(levelT>>3))>>1)%4+4)%4];ctx.fillRect(x,y-2,1,1);}

function drawPlayer(){const p=P;
 if(state==='dying'){const q=Math.min(3,Math.floor(st/10))*(st<40?1:0);const turns=st<60?Math.floor(st/6)%4:1;
  ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y-8));ctx.rotate(turns*Math.PI/2);ctx.drawImage(SP.stand.r,-8,-8);ctx.restore();
  if(st>60){ctx.fillStyle='#ffd800';const hx=Math.round(p.x),hy=Math.round(p.y-20-Math.min(10,(st-60)/6));ctx.fillRect(hx-3,hy,7,1);ctx.fillRect(hx-4,hy+1,1,1);ctx.fillRect(hx+4,hy+1,1,1);ctx.fillRect(hx-3,hy+2,7,1);}
  return q;}
 for(const t of p.trail){ctx.globalAlpha=t.t/24;ctx.drawImage(t.f<0?SP.jump.l:SP.jump.r,Math.round(t.x-8),Math.round(t.y-16));}
 ctx.globalAlpha=1;
 if(p.inv>0&&state==='play'&&(gt>>2)&1)return;
 let s,flip=p.face<0;
 if(p.climb){s=SP.climb;flip=((p.climbAnim>>3)&1)===1;}
 else if(p.dashT>0)s=SP.jump;
 else if(!p.ground)s=p.fly?(((gt>>2)&1)?SP.jump:SP.flyB):SP.jump;
 else if(Math.abs(p.vx)>0.1){const f=(p.anim>>2)%4;s=[SP.walk1,SP.stand,SP.walk2,SP.stand][f];}
 else s=SP.stand;
 let dx=0;if(p.tangle>0)dx=(gt>>1)&1?1:-1;
 spr(s,p.x-8+dx,p.y-16,flip);
 if(p.tangle>0){ctx.fillStyle='#08080c';ctx.fillRect(Math.round(p.x-6),Math.round(p.y-2),12,2);ctx.fillStyle='#b040ff';ctx.fillRect(Math.round(p.x-3+((gt>>2)%6)),Math.round(p.y-2),1,1);}
 if(p.hold){if(p.holdKind==='oil')drawBarrel({x:p.x,y:p.y-16,rot:0,stun:0});else spr(SP.seed,p.x-5,p.y-24);}
 if(p.rain>0&&!p.climb){const cx=Math.round(p.x+p.face*8-5),cy=Math.round(p.y-25+((gt>>4)&1));
  if(!(p.rain<120&&(gt>>2)&1))spr(SP.cloud,cx,cy);
  if(gt%2===0)parts.push({x:p.x+p.face*rnd(3,14),y:p.y-18,vx:0,vy:1.6,c:'#9adcff',t:10,g:0});}
 if(p.squawkT>0){const r=Math.round((26-p.squawkT)*2.6);for(let k=0;k<48;k++){const a=k/48*6.283;ctx.fillStyle=k%2?'#ffd800':'#fff';
   ctx.fillRect(Math.round(p.x+Math.cos(a)*r),Math.round(p.y-8+Math.sin(a)*r),1,1);}}
 if(p.dashT>0){for(let i=0;i<3;i++){ctx.fillStyle=['#e82828','#fff','#2a5cff'][i];ctx.fillRect(Math.round(p.x-p.face*(8+i*4)),Math.round(p.y-11+i*3),6,2);}}}
function drawPick(k){const y=Math.round(segY(k.seg,k.x));const bob=(gt>>4)&1;
 if(k.type==='seed'){spr(SP.seed,k.x-5,y-8);if(Math.abs(P.x-k.x)<16&&Math.abs(P.y-y)<10&&!P.hold&&(gt>>3)&1)txt(touchOn?'SEED':'X',k.x-(touchOn?12:2),y-18,'#ffd800');}
 else if(k.type==='rain'){spr(SP.cloud,k.x-4,y-8-bob);if((gt>>4)%4===0){ctx.fillStyle='#fff';ctx.fillRect(k.x+3,y-10-bob,1,1);}}
 else{const s=[SP.banana,SP.acai,SP.orchid][k.sub];spr(s,k.x-Math.floor(s.w/2),y-s.h-1-bob);}}
function drawHUD(){
 if(state!=='play'||(gt>>4)&1||true)txt('1UP',18,2,(state==='play'&&(gt>>4)&1)?'#600':'#ff3030');
 txt(String(score).padStart(6,'0'),6,11,'#fff');
 txt('HIGH SCORE',112,2,'#ff3030',1,'c');txt(String(hiScore()).padStart(6,'0'),112,11,'#fff',1,'c');
 for(let i=0;i<Math.min(lives,7);i++)spr(SP.mini,6+i*9,21);
 txt('NRG',6,31,'#3ed43e');ctx.fillStyle='#222';ctx.fillRect(25,32,42,5);
 const e=P?P.energy:100;ctx.fillStyle=e<35?((gt>>3)&1?'#ff3030':'#802020'):e<70?'#ffd800':'#3ed43e';ctx.fillRect(26,33,Math.round(40*e/100),3);
 txt('L='+String(level).padStart(2,'0'),182,14,'#4a7cff');
 ctx.fillStyle='#3ce8ff';ctx.fillRect(172,27,48,20);ctx.fillStyle='#000';ctx.fillRect(173,28,46,18);
 ctx.fillStyle='#000';ctx.fillRect(179,24,34,8);txt('BONUS',181,25,'#ff4ad8');
 const bc=bonus<=1000&&state==='play'&&(gt>>3)&1?'#ff3030':'#fff';txt(String(bonus).padStart(4,'0'),196,35,bc,1,'c');
 if(muted)txt('M',214,2,'#666');}

 drawBackdrop();ladders.forEach(drawLadder);segs.forEach(drawSeg);for(const t of trees){const y=Math.round(segY(t.seg,t.x)),h=Math.max(1,Math.ceil(9*Math.min(1,t.t/60)));ctx.drawImage(SP.tree.r,0,9-h,8,h,Math.round(t.x)-4,y-h,8,h);}
 tapes.forEach(drawTape);if(def.drum)drawDrum();
 picks.forEach(drawPick);drawLib();drawBoss();
 for(const w of walkers){const s=w.kind==='saw'?((w.t>>3)&1?SP.saw1:SP.saw2):((w.t>>3)&1?SP.axe1:SP.axe2);
  spr(w.stun>0?(w.kind==='saw'?SP.saw1:SP.axe1):s,w.x-5,w.y-14+(w.stun>0?0:0),w.dir<0);if(w.stun>0)stars(w.x,w.y-16);}
 for(const f of flames){spr(SP.flame,f.x-5,f.y-10-((f.t>>3)&1),(f.t>>3)&1);if(f.stun>0)stars(f.x,f.y-13);}
 barrels.forEach(drawBarrel);logs.forEach(drawLog);
 for(const p of projs){if(p.kind==='oil')drawBarrel({x:p.x,y:p.y,rot:p.rot,stun:0});else spr(SP.seed,p.x-5,p.y-8);}
 drawPlayer();
 for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),1,1);}

function drawTitle(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 // girder frame
 const gt8=girderTile('#a8642a','#3a1e08','#5fcf3f');for(let x=0;x<224;x+=8){ctx.drawImage(gt8,x,32);ctx.drawImage(gt8,x,236);}
 txt('1UP',18,2,'#ff3030');txt(String(score).padStart(6,'0'),6,11);txt('HIGH SCORE',112,2,'#ff3030',1,'c');
 txt(String(hiScore()).padStart(6,'0'),112,11,'#fff',1,'c');txt('CREDIT 01',218,11,'#3ce8ff',1,'r');
 const sh=(gt>>3)%4;txt('LORD B',113,44,'#b01010',4,'c');txt('LORD B',112,43,['#ffd800','#ffe440','#ffd800','#ffb000'][sh],4,'c');
 txt('SAVE THE',112,76,'#fff',1,'c');txt('RAINFOREST!',113,86,'#0a5a1a',2,'c');txt('RAINFOREST!',112,85,'#3ed43e',2,'c');txt('- MATA ATLANTICA -',112,100,'#ffd800',1,'c');
 {const fy=Math.round(Math.sin(gt*0.06)*2);ctx.drawImage((gt>>3)&1?SP.jump.r:SP.flyB.r,4,68+fy,32,32);
  ctx.drawImage(SP.lady.r,188,62,32,40);if((gt>>5)%2)txt('HELP!',204,52,'#fff',1,'c');}
 const page=Math.floor(st/420)%3;
 if(page===0){// hero + controls
    const C=[['\u2190\u2192 \u2191\u2193 / WASD','MOVE/CLIMB'],['SPACE','JUMP'],['HOLD SPACE','FLY (NRG)'],['SHIFT','SPRINT'],
   ['Z / J','JUNGLE SQUAWK'],['X / K','SEED BOMB'],['C / L','PARROT DASH'],['P  M  T','PAUSE MUTE CRT']];
  txt('- CONTROLS -',112,112,'#3ce8ff',1,'c');
  C.forEach(([k,v],i)=>{txt(k,14,123+i*9,'#ffd800');txt(v,212,123+i*9,'#fff',1,'r');});
  txt('CLIMB THE VINES, SAVE LADY MACAW!',112,199,'#ff70c0',1,'c');}
 else if(page===1){txt('- CAST OF CHARACTERS -',112,111,'#3ce8ff',1,'c');
  const rows=[[y=>drawBarrel({x:26,y:y+8,rot:gt,stun:0}),'OIL BARREL','#9adcff'],
   [y=>spr(SP.flame,21,y-1),'FOREST FIRE','#ff8c00'],
   [y=>drawLog({x:26,y:y+12,warn:0,ang:gt*0.1}),'FALLING LOG','#c08a40'],
   [y=>{ctx.fillStyle='#08080c';ctx.fillRect(16,y+5,20,2);for(let x=17;x<35;x+=2){ctx.fillStyle=['#b040ff','#30d0ff','#40ff80','#ffd800'][((x+(gt>>3))>>1)%4];ctx.fillRect(x,y+5,1,1);}},'OIL SLICK','#b040ff'],
   [y=>spr((gt>>3)&1?SP.saw1:SP.saw2,21,y-5),'CHAINSAW LOGGER','#ff5050'],
   [y=>spr(SP.seed,21,y-1),'SEED BOMB (TOSS)','#3ed43e'],
   [y=>spr(SP.cloud,21,y-1),'RAIN CLOUD = DOUSE','#9adcff']];
  rows.forEach(([f,n,c],i)=>{const y=123+i*12;f(y);txt(n,44,y,c);});
  ctx.drawImage(SP.bossA.r,176,150,24,24);txt('BIG',188,178,'#ffd800',1,'c');txt('LOGGER',188,187,'#ffd800',1,'c');}
 else{txt('- TOP 5 RANGERS -',112,111,'#3ce8ff',1,'c');txt('RANK  SCORE   NAME  L',112,123,'#ff4ad8',1,'c');
  HS.forEach((h,i)=>{const c=i===lastRank&&(gt>>3)&1?'#ffd800':['#ffd800','#fff','#fff','#9adcff','#9adcff'][i];
   txt(`${['1ST','2ND','3RD','4TH','5TH'][i]}  ${String(h.s).padStart(6,' ')}   ${h.n}  ${String(h.l||1).padStart(2,'0')}`,112,135+i*12,c,1,'c');});
  txt('PROTECT THE FOREST!',112,199,'#3ed43e',1,'c');}
 if((gt>>5)&1)txt(touchOn?'TAP START':'PUSH SPACE OR ENTER',112,218,'#fff',1,'c');
 txt('\u00a9 1982 JUNGLE ARCADE CO.',112,246,'#3ed43e',1,'c');}
function drawIntro(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawHUD();
 const li=(level-1)%3,round=Math.floor((level-1)/3)+1;
 txt('STAGE '+(li+1)+(round>1?'  ROUND '+round:''),112,60,'#3ce8ff',1,'c');
 txt(def.name,112,76,'#ffd800',1,'c');
 // stack of Lord Bs like the classic "how high" screen
 for(let i=0;i<=li;i++){spr(SP.stand,70,186-i*26);txt((25*(i+1))+' M',96,180-i*26,'#fff');}

 spr(SP.lady,149,120);drawCage(157,140,false,23,9);
 txt(def.tip[0],112,214,'#fff',1,'c');txt(def.tip[1],112,224,'#fff',1,'c');
 if(round>1)txt('EVERYTHING IS FASTER!',112,198,'#ff3030',1,'c');
 if((gt>>4)&1)txt('HOW HIGH CAN YOU FLY?',112,40,'#fff',1,'c');}
function drawOverlay(){
 if(state==='clear'){
  box(28,96,168,46,'#ff70c0');txt(def.free[0],112,104,'#ffd800',1,'c');txt(def.free[1],112,116,'#fff',1,'c');
  txt('BONUS '+bonus,112,129,'#3ce8ff',1,'c');}
 if(state==='gameover'){box(56,104,112,36,'#ff3030');txt('GAME OVER',112,112,'#ff3030',2,'c');}
 if(state==='entry'){ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,40,W,216);
  txt('NEW HIGH SCORE!',112,70,'#ffd800',1,'c');txt(String(score),112,84,'#fff',2,'c');
  txt('ENTER YOUR INITIALS',112,112,'#3ce8ff',1,'c');
  for(let i=0;i<3;i++){const c=LETTERS[entry.c[i]];const sel=i===entry.i;txt(c,88+i*20,130,sel&&(gt>>3)&1?'#ffd800':'#fff',2);
   if(sel){ctx.fillStyle='#ffd800';ctx.fillRect(88+i*20,147,10,2);}}
  txt('\u2191\u2193 LETTER  \u2190\u2192 MOVE',112,166,'#9adcff',1,'c');txt(touchOn?'JUMP = OK':'SPACE/ENTER = OK',112,178,'#9adcff',1,'c');}
 if(paused){box(64,110,96,30,'#ffd800');txt('PAUSED',112,116,'#ffd800',1,'c');txt(touchOn?'START':'P TO RESUME',112,128,'#fff',1,'c');}}
function render(){
 if(state==='title')drawTitle();
 else if(state==='intro')drawIntro();
 else if(state==='entry'){drawWorld();drawOverlay();}
 else{drawWorld();drawOverlay();}}

/* ------------------------------ loop ------------------------------- */
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(250,now-last);last=now;let n=0;
 while(acc>=DT&&n<8){step();acc-=DT;n++;}
 try{render();}catch(e){console.error(e);}
 musicTick();requestAnimationFrame(frame);}
if((window.matchMedia&&matchMedia('(pointer: coarse)').matches)||('ontouchstart' in window))enableTouch();
resize();setTimeout(resize,50);requestAnimationFrame(frame);
})();
